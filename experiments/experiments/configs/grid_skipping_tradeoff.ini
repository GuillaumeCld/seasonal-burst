[experiment]
name = grid_skipping_tradeoff
description = Evaluate the tradeoff between skipping and accuracy on grid data

[parameters]
min_length = 14
max_length = 365
period_length = 365
threshold = 4.0
skip_factors = [1, 2, 5, 10, 20]
skip_method = "length"

[data]
# Mediterranean SST data
; path = "Data/SST/merged_data_processed.nc"
; variable = "sst"
; intra_period = False

; # European temperature data
; path = "Data/ERA5_land/t2m_daily_avg_1950_2023.nc"
; variable = "t2m"
; intra_period = False

; # European precipitation data
path = "Data/ERA5_land/tp_daily_sum_1950_2023.nc"
variable = "tp"
intra_period = False

[output]
results_dir = experiments/
metrics_filename = grid_tradeoff_metrics_tp.csv

[execution]
n_runs = 1
random_seed = 42 