[experiment]
name = exhaustive_algo_scaling
description = Evaluate the scaling behavior of the exhaustive search algorithm

[common]
max_lengths = [24, 72, 240]
threshold = 3.0

[period_length_scaling]
min_period_length = 365
max_period_length = 8760
step_period_length = 1000
n_period = 50

[n_period_scaling]
min_n_period = 10
max_n_period = 100
step_n_period = 20
period_length = 8760

[output]
results_dir = experiments/
plot_filename = scaling_results.pdf
metrics_filename = scaling_metrics.csv

[execution]
n_runs = 5
random_seed = 42
