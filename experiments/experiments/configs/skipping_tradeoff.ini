[experiment]
name = skipping_tradeoff
description = Evaluate the tradeoff between skipping and accuracy

[parameters]
min_length = 1
max_length = 365
period_length = 365
threshold = 3.0
skip_factors = [1, 2, 5, 10, 20]
skip_methods = ["date", "length"]
grid_experiments = True

[data]
path = "Data/SST/mediterranean_average_processed.npy"
intra_period = False

[output]
results_dir = experiments/
plot_filename = tradeoff_results.pdf
metrics_filename = tradeoff_metrics.csv

[execution]
n_runs = 1
random_seed = 42