[experiment]
name = online_scaling
description = Evaluate the scaling behavior of the online algorithm

[parameters]
min_length = 1
max_length = 365
step_length = 1
period_length = 365
threshold = 3.0
init_years= 30
processing_years = 30
[data]
path = "Data/SST/mediterranean_average_processed.npy"

[output]
results_dir = icdm-paper/
plot_filename = online_scaling_results.pdf
metrics_filename = online_scaling_metrics.csv

[execution]
n_runs = 5
random_seed = 42    