[experiment]
name = grid_skipping_tradeoff
description = Evaluate the tradeoff between skipping and accuracy on grid data

[parameters]
min_length = 1
max_length = 365
period_length = 365
threshold = 3.0
skip_factors = [1, 2, 5, 10, 20]
skip_method = "length"

[data]
# Mediterranean SST data
path = "Data/SST/merged_data_processed.nc"
variable = "sst"
intra_period = False

; # European temperature data
; temp_path = "Data/ERA5_land/EUW/t2m_daily_avg_1950_2023.nc"
; temp_variable = "t2m"
; temp_intra_period = False

; # European precipitation data
; prec_path = "Data/ERA5_land/EUW/tp_daily_sum_1950_2023.nc"
; prec_variable = "tp"
; prec_intra_period = False

[output]
results_dir = icdm-paper/
metrics_filename = grid_tradeoff_metrics.csv

[execution]
n_runs = 1
random_seed = 42 